# Paquetes de dbt (se instalan con `dbt deps`)
# dbt_utils: macros generales (dedupe, columnas, etc.)
# dbt_expectations: tests avanzados de calidad de datos (rangos, distribución)
packages:
  - package: dbt-labs/dbt_utils
    version: [">=1.1.0", "<2.0.0"]
  - package: calogica/dbt_expectations
    version: [">=0.10.0", "<0.11.0"]