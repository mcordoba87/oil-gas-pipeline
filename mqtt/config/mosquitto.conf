# ===============================================================================
# Mosquitto - Configuración básica Fase 0
# Listener MQTT (TCP) en 1883 + WebSockets en 9001
# ACLs y TLS se agregarán más adelante (roadmap Fase 0.1: mqtt/ # Configuración)
# ===============================================================================

# Listener estándar MQTT
listener 1883
allow_anonymous true

# Listener WebSockets (para clientes de navegador / SCADA)
listener 9001
protocol websockets
allow_anonymous true

# Persistencia de mensajes en disco
persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type all