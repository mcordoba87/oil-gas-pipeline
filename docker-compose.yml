# ===============================================================================
# MONITOREO IOT DE POZOS Y MANTENIMIENTO PREDICTIVO - FASE 0
# Infraestructura base: MQTT broker, Time-Series DB, MinIO lakehouse y Grafana.
# Incluye postgres_oltp (ERP/CMMS) adelantado del roadmap multi-fuente.
# ===============================================================================

name: oilgas

services:
  # ---------------------------------------------------------------- MQTT Broker
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: oilgas-mosquitto
    restart: unless-stopped
    ports:
      - "${MOSQUITTO_PORT:-1883}:1883"
      - "${MOSQUITTO_WS_PORT:-9001}:9001"
    volumes:
      - ./mqtt/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    networks:
      - oil_net
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -p 1883 -t '$$SYS/broker/uptime' -C 1 -W 3 >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ------------------------------------------------------------ Time-Series DB
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: oilgas-timescaledb
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${TSDB_POSTGRES_USER}
      POSTGRES_PASSWORD: ${TSDB_POSTGRES_PASSWORD}
      POSTGRES_DB: ${TSDB_POSTGRES_DB}
    ports:
      - "${TSDB_PORT:-5432}:5432"
    volumes:
      - ./timescaledb/init:/docker-entrypoint-initdb.d:ro
      - tsdb_data:/var/lib/postgresql/data
    networks:
      - oil_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TSDB_POSTGRES_USER} -d ${TSDB_POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ----------------------------------------------------- Postgres OLTP ERP/CMMS
  postgres_oltp:
    image: postgres:16-alpine
    container_name: oilgas-postgres_oltp
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${OLTP_POSTGRES_USER}
      POSTGRES_PASSWORD: ${OLTP_POSTGRES_PASSWORD}
      POSTGRES_DB: ${OLTP_POSTGRES_DB}
    ports:
      - "${OLTP_PORT:-5433}:5432"
    volumes:
      - ./postgres_oltp/init:/docker-entrypoint-initdb.d:ro
      - oltp_data:/var/lib/postgresql/data
    networks:
      - oil_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${OLTP_POSTGRES_USER} -d ${OLTP_POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ------------------------------------------------------------------- MinIO
  minio:
    image: minio/minio:latest
    container_name: oilgas-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    networks:
      - oil_net
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || curl -fsS http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ------------------------------------------- Job one-shot: crear bucket inicial
  minio-init:
    image: minio/mc:latest
    container_name: oilgas-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
    entrypoint: >
      /bin/sh -c "
      mc alias set oil http://minio:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\" &&
      mc mb --ignore-existing oil/\"$$MINIO_BUCKET\" &&
      echo '=== Bucket oil-lakehouse listo ===' &&
      mc ls oil
      "
    networks:
      - oil_net

  # --------------------------------- Mock de API de precios WTI/Brent (Fase 1)
  mock_prices:
    build:
      context: .
      dockerfile: api/mock_prices.Dockerfile
    image: oilgas-mock-prices:latest
    container_name: oilgas-mock_prices
    restart: unless-stopped
    ports:
      - "8001:8001"
    networks:
      - oil_net
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=2)\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ------------------------------ API de pozos (Fase 4, item 4.3)
  pozos_api:
    build:
      context: .
      dockerfile: api/pozos_api.Dockerfile
    image: oilgas-pozos-api:latest
    container_name: oilgas-pozos_api
    restart: unless-stopped
    depends_on:
      timescaledb:
        condition: service_healthy
    environment:
      TIMESDB_DB_URL: postgresql://${TSDB_POSTGRES_USER}:${TSDB_POSTGRES_PASSWORD}@timescaledb:5432/${TSDB_POSTGRES_DB}
      API_KEY: ${API_KEY}
    ports:
      - "${API_PORT:-8000}:8000"
    networks:
      - oil_net
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ------------------------------------------------------------------- Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: oilgas-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      TSDB_POSTGRES_USER: ${TSDB_POSTGRES_USER}
      TSDB_POSTGRES_PASSWORD: ${TSDB_POSTGRES_PASSWORD}
      TSDB_POSTGRES_DB: ${TSDB_POSTGRES_DB}
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    networks:
      - oil_net
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ----------------------------------------- Redis (cache / results backend de Superset)
  redis:
    image: redis:7-alpine
    container_name: oilgas-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - oil_net
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ------------------------ Apache Superset (Fase 4, item 4.2)
  # La imagen lean oficial no trae psycopg2 (driver de Postgres/TimescaleDB):
  # entrypoint.sh instala superset/init/requirements-local.txt en el venv.
  # Los tres servicios corren como root para poder escribir en el venv.
  #
  # Job one-shot (patrón minio-init): migra el metastore, crea el admin y los
  # permisos base. Debe terminar antes de arrancar el servicio `superset`.
  superset-init:
    image: apache/superset:${SUPERSET_VERSION}
    container_name: oilgas-superset-init
    user: "0:0"
    depends_on:
      timescaledb:
        condition: service_healthy
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
      SUPERSET_ADMIN_USER: ${SUPERSET_ADMIN_USER}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD}
      SUPERSET_ADMIN_EMAIL: ${SUPERSET_ADMIN_EMAIL}
    volumes:
      - superset_data:/app/superset_home
      - ./superset/init:/app/superset-init:ro
      - ./superset/config/superset_config.py:/app/pythonpath/superset_config.py:ro
    entrypoint: ["/bin/bash", "/app/superset-init/entrypoint.sh", "/bin/bash", "/app/superset-init/superset-init.sh"]
    networks:
      - oil_net
    restart: "no"

  # Servidor web de Superset (gunicorn). El metastore queda listo tras superset-init.
  superset:
    image: apache/superset:${SUPERSET_VERSION}
    container_name: oilgas-superset
    restart: unless-stopped
    user: "0:0"
    depends_on:
      superset-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
      SUPERSET_LOAD_EXAMPLES: "no"
      REDIS_HOST: redis
      REDIS_PORT: 6379
    entrypoint: ["/bin/bash", "/app/superset-init/entrypoint.sh", "/app/docker/docker-bootstrap.sh", "app-gunicorn"]
    ports:
      - "${SUPERSET_PORT:-8088}:8088"
    volumes:
      - superset_data:/app/superset_home
      - ./superset/init:/app/superset-init:ro
      - ./superset/config/superset_config.py:/app/pythonpath/superset_config.py:ro
    networks:
      - oil_net
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8088/health', timeout=3)\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Job one-shot: registra TimescaleDB como database y crea los datasets de los
  # marts vía REST API (idempotente). Espera a que `superset` esté healthy.
  superset-provision:
    image: apache/superset:${SUPERSET_VERSION}
    container_name: oilgas-superset-provision
    user: "0:0"
    depends_on:
      superset:
        condition: service_healthy
    environment:
      SUPERSET_ADMIN_USER: ${SUPERSET_ADMIN_USER}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD}
      TIMESDB_SQLALCHEMY_URI: postgresql://${TSDB_POSTGRES_USER}:${TSDB_POSTGRES_PASSWORD}@timescaledb:5432/${TSDB_POSTGRES_DB}
    entrypoint: ["/bin/bash", "/app/superset-init/entrypoint.sh", "python", "-u", "/app/superset-init/provision.py"]
    volumes:
      - ./superset/init:/app/superset-init:ro
      - ./superset/config/superset_config.py:/app/pythonpath/superset_config.py:ro
    networks:
      - oil_net
    restart: "no"

# ===============================================================================
networks:
  oil_net:
    driver: bridge

volumes:
  mosquitto_data:
  mosquitto_log:
  tsdb_data:
  oltp_data:
  minio_data:
  grafana_data:
  superset_data:
  redis_data: